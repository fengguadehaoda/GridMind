# GridMind CI 工作流（D2）
# ---------------------------------------------------------------------------
# 触发：push / PR 到 main
# Job 1 后端测试：Python 3.13 + pytest（含 pytest.ini 的 asyncio_mode=auto）
# Job 2 前端构建：Node 22 + npm ci + type-check + build（web/ 子目录）
# Job 3 镜像构建：docker build 冒烟（仅 push 时执行）
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: 后端测试 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 运行 pytest
        run: python -m pytest -q
        env:
          MOCK_ENABLED: "true"
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: gridmind-dev

  frontend-build:
    name: 前端构建 (Vite + Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run type-check

      - name: 构建
        run: npm run build

  docker-build:
    name: 镜像构建 (可选)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: 构建 GridMind 后端镜像
        run: docker build -t gridmind:ci .
