# GridMind pytest 配置
# ---------------------------------------------------------------------------
# - asyncio_mode = auto        : async def test_* 无需 @pytest.mark.asyncio 即可
#                                收集执行（D3：修复 10 个 asyncio 测试全部失败）
# - testpaths = tests          : 只收集 tests/ 下测试
# - python_files = test_*.py   : 显式声明收集文件名模式（pytest 默认值，保持可读）
# - python_functions = test_*  : 显式声明收集函数名模式（同上）
# - addopts = --ignore=tests/scripts : 跳过脚本式 print/assert 测试（D6：7 个
#                                脚本已移至 tests/scripts/，不参与 pytest 收集）
# ---------------------------------------------------------------------------
[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = --ignore=tests/scripts
