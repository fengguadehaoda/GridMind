    <polygon points="40,16 62,28 62,52 40,64 18,52 18,28" fill="rgba(0, 229, 255, 0.08)" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.4" stroke-linejoin="round"/>
    <path d="M40 24 L52 48 L40 56 L28 48 Z" fill="#00E5FF"/>
