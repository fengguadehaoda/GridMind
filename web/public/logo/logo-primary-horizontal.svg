<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" role="img" aria-label="灵枢电网 GridMind">
  <!-- 标记：六边形 + 中心电枢（暗底主用） -->
  <g transform="translate(8, 8)">
    <!-- 外圈六边形 -->
    <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linejoin="round"/>
    <!-- 内圈六边形（弱描边） -->
    <polygon points="20,8 31,14 31,26 20,32 9,26 9,14" fill="rgba(0, 229, 255, 0.08)" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.4" stroke-linejoin="round"/>
    <!-- 中心电枢指针（菱形/箭头） -->
    <path d="M20 12 L26 24 L20 28 L14 24 Z" fill="#00E5FF"/>
    <circle cx="20" cy="20" r="2" fill="#FFB300"/>
    <!-- 4 个节点（顶点） -->
    <circle cx="20" cy="2" r="1.5" fill="#00E5FF"/>
    <circle cx="36" cy="11" r="1.5" fill="#00E5FF" fill-opacity="0.6"/>
    <circle cx="36" cy="29" r="1.5" fill="#FFB300"/>
    <circle cx="20" cy="38" r="1.5" fill="#00E5FF" fill-opacity="0.6"/>
    <circle cx="4" cy="29" r="1.5" fill="#00E5FF" fill-opacity="0.6"/>
    <circle cx="4" cy="11" r="1.5" fill="#00E5FF"/>
  </g>
  <!-- 分隔条 -->
  <line x1="58" y1="14" x2="58" y2="42" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.4"/>
  <!-- 中文主名 -->
  <text x="68" y="26" font-family="'PingFang SC', 'Microsoft YaHei', 'Inter', sans-serif" font-size="18" font-weight="700" fill="#E6F1FF" letter-spacing="2">灵枢电网</text>
  <!-- 英文副名 + 副标 -->
  <text x="68" y="42" font-family="'Orbitron', 'Inter', sans-serif" font-size="10" font-weight="500" fill="#00E5FF" letter-spacing="1.5">GridMind · 电力 AI 调度中枢</text>
</svg>
